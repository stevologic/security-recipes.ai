# ============================================================================
# Hugo configuration - security-recipes.ai
# Uses the Hextra theme (https://imfing.github.io/hextra/)
# ============================================================================

# For GitHub Pages deploys this value is overridden by CI through
# `hugo --baseURL ...`, so forks and repo renames work without editing this
# file. The value below is for local `hugo server` and Docker builds.
baseURL: "https://security-recipes.ai/"
title: "security-recipes.ai"
languageCode: en-us

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.7

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark

# Hextra needs HTML output. The recipe indexes power MCP/API consumption
# patterns. Marketplace feeds remain as static helper-tool metadata.
outputs:
  home: [HTML, RECIPESINDEX, AGENTRECIPES, MARKETPLACECATALOG, MARKETPLACEINPUTS, MARKETPLACEOUTPUTS, MARKETPLACEREPORTS, MARKETPLACEWORKFLOWS, MARKETPLACEREADINESS, MARKETPLACEMANIFEST]
  page: [HTML]
  section: [HTML, RSS]

outputFormats:
  RECIPESINDEX:
    mediaType: application/json
    baseName: recipes-index
    isPlainText: true
    notAlternative: true
  AGENTRECIPES:
    mediaType: application/json
    path: api
    baseName: recipes
    isPlainText: true
    notAlternative: true
  MARKETPLACECATALOG:
    mediaType: application/json
    baseName: marketplace-catalog
    isPlainText: true
    notAlternative: true
  MARKETPLACEINPUTS:
    mediaType: application/json
    baseName: marketplace-input-channels
    isPlainText: true
    notAlternative: true
  MARKETPLACEOUTPUTS:
    mediaType: application/json
    baseName: marketplace-output-channels
    isPlainText: true
    notAlternative: true
  MARKETPLACEREPORTS:
    mediaType: application/json
    baseName: marketplace-report-profiles
    isPlainText: true
    notAlternative: true
  MARKETPLACEWORKFLOWS:
    mediaType: application/json
    baseName: marketplace-workflow-templates
    isPlainText: true
    notAlternative: true
  MARKETPLACEREADINESS:
    mediaType: application/json
    baseName: marketplace-readiness
    isPlainText: true
    notAlternative: true
  MARKETPLACEMANIFEST:
    mediaType: application/json
    baseName: marketplace-control-plane
    isPlainText: true
    notAlternative: true

# Keep the primary nav intentionally small. Deeper pages stay discoverable
# through section sidebars and search.
menu:
  main:
    # Primary nav intentionally maps one label to one destination section, in
    # the order a visitor moves: pick a recipe, follow a playbook, wire the
    # agent, connect context, read the docs. "Recipes" (the prompt library) and
    # "Playbooks" (curated remediation guides) are deliberately distinct so the
    # sidebar no longer shows two entries both called "Recipes".
    - identifier: recipes
      name: Recipes
      pageRef: prompt-library
      weight: 1

    - identifier: playbooks
      name: Playbooks
      pageRef: security-remediation
      weight: 2

    - identifier: agents
      name: Agents
      pageRef: agents
      weight: 3

    - identifier: mcp-servers
      name: MCP
      pageRef: mcp-servers
      weight: 4

    - identifier: docs
      name: Docs
      pageRef: docs
      weight: 5

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 100
    - identifier: contribute-sidebar
      name: Contribute
      pageRef: /contribute
      weight: 101

params:
  description: >
    Security recipes for AI-assisted remediation: reviewed playbooks,
    prompts, agent setup guides, and MCP context patterns that keep agents
    scoped, evidence-driven, and human-reviewed.

  seo:
    siteName: "Security Recipes"
    author: "security-recipes.ai contributors"
    twitter: ""
    defaultImage: "images/og-card.svg"
    defaultImageWidth: 1200
    defaultImageHeight: 630
    sameAs:
      - "https://github.com/stevologic/security-recipes.ai"
    defaultKeywords:
      - "security recipes"
      - "agentic security remediation"
      - "AI security remediation"
      - "AI coding agents"
      - "vulnerability remediation"
      - "CVE remediation"
      - "GitHub Copilot"
      - "Claude Code"
      - "Cursor"
      - "Devin"
      - "Codex"
      - "MCP servers"
      - "SAST"
      - "secure software supply chain"
      - "OWASP Top 10"

  repoURL: "https://github.com/stevologic/security-recipes.ai"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo.svg

  theme:
    default: dark
    displayToggle: true

  # Load Mermaid from a vendored, version-pinned copy in assets/js instead of
  # Hextra's default `cdn.jsdelivr.net/npm/mermaid@latest`. This keeps builds
  # deterministic and works on air-gapped networks, matching the site's
  # no-external-resources posture. Setting `js` without `base` makes Hextra
  # resolve it as a local Hugo asset.
  mermaid:
    js: js/mermaid.min.js

  footer:
    displayCopyright: true
    displayPoweredBy: false
    copyright: "Copyright 2026 security-recipes.ai - bounded recipes for agent-assisted security remediation"

  page:
    width: normal

  toc:
    displayTags: true

  editURL:
    enable: false

  search:
    enable: false
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
