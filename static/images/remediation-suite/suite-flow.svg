<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">security-recipes.ai remediation suite flow</title>
  <desc id="desc">A finding flows into a domain-specific Python remediation tool, imports recipes and optional LLM help, then produces a pull request handoff, triage note, evidence packet, or audit record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.48" stop-color="#06080d"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)"/>
  <path d="M80 410C250 270 340 455 500 300C640 165 755 310 910 165C1005 77 1090 105 1160 74" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="2"/>
  <text x="70" y="72" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Remediation suite run</text>
  <text x="70" y="106" fill="#aeb7c6" font-family="Segoe UI, Arial, sans-serif" font-size="17">Each domain tool plans one bounded remediation path and keeps human review in the loop.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="200" height="135" rx="8" fill="#0a1118" stroke="#334155"/>
    <rect x="92" y="187" width="48" height="48" rx="8" fill="#0e7490" fill-opacity="0.28" stroke="#67e8f9"/>
    <text x="154" y="206" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Finding</text>
    <text x="92" y="252" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">SCA, SARIF, DLP,</text>
    <text x="92" y="274" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">container, review, audit</text>

    <rect x="365" y="145" width="250" height="175" rx="8" fill="#081119" stroke="#2dd4bf"/>
    <text x="391" y="183" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Domain Python tool</text>
    <text x="391" y="215" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">deps, sast, sde, base-image,</text>
    <text x="391" y="237" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">cache-purge, gate, runtime,</text>
    <text x="391" y="259" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">defaults, review, audit...</text>
    <rect x="391" y="280" width="152" height="26" rx="6" fill="#10202a" stroke="#334155"/>
    <text x="406" y="298" fill="#79f2e5" font-family="Consolas, monospace" font-size="13">one finding in</text>

    <rect x="710" y="145" width="205" height="175" rx="8" fill="#0b1117" stroke="#64748b"/>
    <text x="736" y="183" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Context import</text>
    <text x="736" y="215" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">/api/recipes.json</text>
    <text x="736" y="237" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">MCP recipe tools</text>
    <text x="736" y="259" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">optional LLM prompt</text>
    <rect x="736" y="280" width="116" height="26" rx="6" fill="#111827" stroke="#334155"/>
    <text x="751" y="298" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">read-only</text>

    <rect x="995" y="165" width="150" height="135" rx="8" fill="#0b1413" stroke="#86efac"/>
    <text x="1020" y="206" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Output</text>
    <text x="1020" y="237" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">PR handoff</text>
    <text x="1020" y="259" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">TRIAGE.md</text>
    <text x="1020" y="281" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="14">evidence packet</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M285 232H342" stroke="url(#teal)" stroke-width="4"/>
    <path d="M342 232l-14-10m14 10l-14 10" stroke="#67e8f9" stroke-width="4"/>
    <path d="M638 232H687" stroke="url(#teal)" stroke-width="4"/>
    <path d="M687 232l-14-10m14 10l-14 10" stroke="#67e8f9" stroke-width="4"/>
    <path d="M938 232H973" stroke="url(#amber)" stroke-width="4"/>
    <path d="M973 232l-14-10m14 10l-14 10" stroke="#86efac" stroke-width="4"/>
  </g>

  <g>
    <rect x="70" y="365" width="1060" height="78" rx="8" fill="#030712" fill-opacity="0.62" stroke="#1f2937"/>
    <text x="96" y="397" fill="#f5f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Enterprise boundary</text>
    <text x="96" y="426" fill="#c8cdd9" font-family="Segoe UI, Arial, sans-serif" font-size="15">Connectors stay scoped: GitHub, GitLab, Azure DevOps, Jira, ServiceNow, Snyk, Wiz, SonarQube, Trivy, registries, GRC, and SIEM systems feed evidence without granting broad write authority.</text>
  </g>
</svg>
