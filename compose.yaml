services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_URL: ${BASE_URL:-http://localhost:8080/}
        REPO_URL: ${REPO_URL:-https://github.com/stevologic/security-recipes.ai}
    image: security-recipes-ai:local
    ports:
      - "${SITE_PORT:-8080}:80"
