x-security-recipes-build: &security-recipes-build
  context: .
  dockerfile: Dockerfile
  args:
    BASE_URL: "${SECURITY_RECIPES_BASE_URL:-https://security-recipes.ai/}"
    REPO_URL: "${SECURITY_RECIPES_REPO_URL:-https://github.com/stevologic/security-recipes.ai}"
    REVISION: "${SECURITY_RECIPES_IMAGE_REVISION:-bootstrap}"

x-security-recipes-logging: &security-recipes-logging
  driver: local
  options:
    max-size: "${SECURITY_RECIPES_LOG_MAX_SIZE:-10m}"
    max-file: "${SECURITY_RECIPES_LOG_MAX_FILES:-5}"

x-security-recipes-runtime: &security-recipes-runtime
  build: *security-recipes-build
  volumes:
    - traffic_report:/usr/share/nginx/html/traffic
  logging: *security-recipes-logging
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    interval: 5s
    timeout: 3s
    start_period: 5s
    retries: 12

services:
  # Blue/green site slots. deploy.sh builds a commit-tagged image only for the
  # inactive slot, verifies it directly, then gracefully switches Caddy. The
  # previous slot stays running as an immediate fallback.
  security-recipes:
    <<: *security-recipes-runtime
    image: "${SECURITY_RECIPES_BLUE_IMAGE:-security-recipes-ai-site:bootstrap}"
    ports:
      - "${SECURITY_RECIPES_HTTP_PORT:-127.0.0.1:8080}:80"

  security-recipes-green:
    <<: *security-recipes-runtime
    image: "${SECURITY_RECIPES_GREEN_IMAGE:-security-recipes-ai-site:bootstrap}"
    ports:
      - "${SECURITY_RECIPES_GREEN_HTTP_PORT:-127.0.0.1:8081}:80"

  # Automatic HTTPS termination. Opt in via COMPOSE_PROFILES=caddy in .env;
  # hosts that already run their own proxy on 80/443 leave this profile off.
  # Certificates live in caddy_data and survive rebuilds and redeploys.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    # API-loaded blue/green order is autosaved in caddy_config and resumed
    # after a container or host restart. --config remains the first-start
    # fallback when no autosave exists yet.
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SECURITY_RECIPES_DOMAIN: "${SECURITY_RECIPES_DOMAIN:-security-recipes.ai}"
      SECURITY_RECIPES_ACME_EMAIL: "${SECURITY_RECIPES_ACME_EMAIL:-admin@security-recipes.ai}"
      SECURITY_RECIPES_PRIMARY_UPSTREAM: "${SECURITY_RECIPES_PRIMARY_UPSTREAM:-security-recipes:80}"
      SECURITY_RECIPES_FALLBACK_UPSTREAM: "${SECURITY_RECIPES_FALLBACK_UPSTREAM:-security-recipes-green:80}"
    volumes:
      # Mount the directory so atomic Git updates do not leave Caddy pinned to
      # an obsolete bind-mounted file inode.
      - ./docker/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      # The managed Droplet uses /var/log/caddy so host Fail2Ban can enforce
      # 404-abuse bans. Standalone Compose keeps the named-volume default.
      - "${SECURITY_RECIPES_TRAFFIC_LOGS_SOURCE:-caddy_logs}:/var/log/caddy"
    depends_on:
      - security-recipes
      - security-recipes-green
    logging: *security-recipes-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Watches Caddy's structured access log and blocks repeated 404 scanners at
  # the host firewall. This must share the host network namespace: changing a
  # container-local firewall would not protect Docker-published ports.
  # Enable with COMPOSE_PROFILES=caddy,fail2ban. Do not run this alongside a
  # host Fail2Ban instance managing the same security-recipes-caddy-404 jail.
  fail2ban:
    image: "${FAIL2BAN_IMAGE:-crazymax/fail2ban:latest}"
    profiles: ["fail2ban"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: "${TZ:-UTC}"
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: "${FAIL2BAN_LOG_LEVEL:-INFO}"
      F2B_DB_PURGE_AGE: "${FAIL2BAN_DB_PURGE_AGE:-1d}"
    volumes:
      - fail2ban_data:/data
      - ./config/fail2ban/filter.d/security-recipes-caddy-404.conf:/data/filter.d/security-recipes-caddy-404.conf:ro
      - ./config/fail2ban/jail.d/security-recipes-caddy-404.local:/data/jail.d/security-recipes-caddy-404.local:ro
      - "${SECURITY_RECIPES_TRAFFIC_LOGS_SOURCE:-caddy_logs}:/var/log/caddy:ro"
    depends_on:
      caddy:
        condition: service_started
    logging: *security-recipes-logging
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # Regenerates a public aggregate traffic dashboard every minute from either
  # bundled or host Caddy logs. The source defaults to the bundled named volume;
  # the droplet installer selects /var/log/caddy for host Caddy.
  traffic-report:
    image: allinurl/goaccess:1.11
    profiles: ["caddy"]
    entrypoint: ["/bin/sh", "/opt/security-recipes/generate-traffic-report.sh"]
    environment:
      TRAFFIC_REPORT_INTERVAL_SECONDS: "${TRAFFIC_REPORT_INTERVAL_SECONDS:-60}"
    volumes:
      - "${SECURITY_RECIPES_TRAFFIC_LOGS_SOURCE:-caddy_logs}:/logs:ro"
      - traffic_report:/report
      - ./docker/goaccess:/opt/security-recipes:ro
    depends_on:
      - caddy
    logging: *security-recipes-logging
    healthcheck:
      test: ["CMD-SHELL", "test -s /report/index.html && test -s /report/traffic-theme.css && test -s /report/.generator-healthy"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 8
    restart: unless-stopped

  mcp-server:
    image: "${RECIPES_MCP_IMAGE:-security-recipes-ai-mcp:bootstrap}"
    build:
      context: .
      dockerfile: Dockerfile.mcp-server
      args:
        REVISION: "${SECURITY_RECIPES_IMAGE_REVISION:-bootstrap}"
    environment:
      RECIPES_MCP_CONFIG: "/app/mcp-server.toml"
      RECIPES_MCP_TRANSPORT: "streamable-http"
      RECIPES_MCP_HOST: "0.0.0.0"
      RECIPES_MCP_PORT: "80"
      RECIPES_MCP_PATH: "/mcp"
      RECIPES_MCP_SOURCE_INDEX_URL: "${RECIPES_MCP_SOURCE_INDEX_URL:-https://security-recipes.ai/api/recipes-index.json}"
      RECIPES_MCP_ALLOWED_SOURCE_HOSTS: "${RECIPES_MCP_ALLOWED_SOURCE_HOSTS:-caddy,security-recipes,security-recipes-green,security-recipes.ai}"
      RECIPES_MCP_PUBLIC_BASE_URL: "${RECIPES_MCP_PUBLIC_BASE_URL:-https://security-recipes.ai/mcp}"
      RECIPES_PUBLIC_SITE_BASE_URL: "${SECURITY_RECIPES_BASE_URL:-https://security-recipes.ai/}"
      RECIPES_MCP_PLAYBOOK_REGISTRY_PATH: "${RECIPES_MCP_PLAYBOOK_REGISTRY_PATH:-/app/data/remediation_suite/playbooks.json}"
      RECIPES_MCP_LOG_LEVEL: "${RECIPES_MCP_LOG_LEVEL:-info}"
      RECIPES_MCP_EAGER_REFRESH: "${RECIPES_MCP_EAGER_REFRESH:-false}"
      # Keep the compact text index lazy on memory-constrained hosts. Exact CVE
      # lookups remain shard-only; operators can opt into eager warming.
      RECIPES_MCP_EAGER_CVE_SEARCH: "${RECIPES_MCP_EAGER_CVE_SEARCH:-false}"
    expose:
      - "80"
    logging: *security-recipes-logging
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  fail2ban_data:
  traffic_report:
