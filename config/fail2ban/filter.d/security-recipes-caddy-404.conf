# Fail2Ban filter for the structured Caddy access log.
#
# Match Caddy's parsed client_ip, a high-confidence exploit-probe URI, and the
# final numeric response status. Generic missing routes are deliberately
# excluded: search crawlers can encounter stale URLs, especially in the
# rolling CVE corpus, and must not be banned for doing so. X-Forwarded-For and
# User-Agent remain untrusted. The current direct-edge deployment makes
# client_ip the socket peer; behind a CDN, bans must move to its WAF/API.

[Definition]
failregex = ^\{.*(?<!\\)"logger"\s*:\s*"http\.log\.access".*(?<!\\)"request"\s*:\s*\{.*(?<!\\)"client_ip"\s*:\s*"<HOST>".*(?<!\\)"uri"\s*:\s*"(?i:/(?:\.(?:env(?:[./][^"?]*)?|git(?:/[^"?]*)?|svn(?:/[^"?]*)?|hg(?:/[^"?]*)?|aws/credentials|DS_Store)|wp-admin(?:/[^"?]*)?|wp-login\.php|xmlrpc\.php|phpmyadmin(?:/[^"?]*)?|pma(?:/[^"?]*)?|adminer\.php|vendor/phpunit(?:/[^"?]*)?|cgi-bin(?:/[^"?]*)?|server-status|actuator(?:/[^"?]*)?|solr/admin(?:/[^"?]*)?|jenkins(?:/[^"?]*)?|boaform/admin(?:/[^"?]*)?|config\.php))(?:\?[^"?]*)?".*\}.*(?<!\\)"status"\s*:\s*404\s*(?:,|\}).*\}$
ignoreregex =
datepattern = "ts":{EPOCH}
