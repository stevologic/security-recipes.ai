# Fail2Ban filter for the structured Caddy access log.
#
# Match only Caddy's parsed client_ip field and final numeric response status.
# Do not use X-Forwarded-For, request headers, the URI, or User-Agent: all are
# attacker-controlled. The current direct-edge deployment makes client_ip the
# socket peer; if a trusted CDN is introduced, bans must move to its WAF/API.

[Definition]
failregex = ^\{.*(?<!\\)"logger"\s*:\s*"http\.log\.access".*(?<!\\)"request"\s*:\s*\{.*(?<!\\)"client_ip"\s*:\s*"<HOST>".*\}.*(?<!\\)"status"\s*:\s*404\s*(?:,|\}).*\}$
ignoreregex =
datepattern = "ts":{EPOCH}
