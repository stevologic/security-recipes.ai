# Browser catalog requests carry a deterministic ?v=<hash/date> token. Those
# representations can be cached immutably; direct/operator URLs stay short
# cached so daily refreshes are visible without a forced cache bust.
map $arg_v $catalog_cache_control {
    ""      "public, max-age=300, stale-while-revalidate=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    large_client_header_buffers 8 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    # Caddy terminates TLS. Keep nginx-generated redirects relative so they do
    # not accidentally send public HTTPS clients back through an HTTP hop.
    absolute_redirect off;

    root   /usr/share/nginx/html;
    index  index.html;
    sendfile on;
    tcp_nopush on;

    # Avoid a filesystem metadata lookup for every request when thousands of
    # recipe and shard paths are hot at once.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # The build outputs pretty URLs like /claude/, /recipes/, etc.
    # Try the literal path, then with trailing slash, then 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The traffic report is written into a shared volume at runtime. Resolve
    # the index file explicitly so an empty/uninitialized directory is never
    # exposed as nginx's directory-listing 403 response.
    location = /traffic {
        return 308 /traffic/;
    }
    location = /traffic/ {
        try_files /traffic/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ^~ /traffic/. {
        return 404;
    }

    # Hosted MCP endpoint served by the private mcp-server container.
    location = /mcp {
        set $mcp_api "http://mcp-server:80";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $mcp_api/mcp;
    }

    location /mcp/ {
        set $mcp_api "http://mcp-server:80";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $mcp_api$request_uri;
    }

    # Same-origin GitHub API relay for optional repository context.
    # Browser-supplied GitHub Authorization is forwarded only for this request.
    location /github-api/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-GitHub-Api-Version $http_x_github_api_version;
        proxy_pass https://api.github.com/;
    }

    # Catalog filenames are stable across daily refreshes, so keep a bounded
    # cache window and permit stale serving while an intermediary revalidates.
    location = /api/cve-catalog/manifest.json {
        try_files $uri =404;
        add_header Cache-Control $catalog_cache_control;
    }
    location ~ ^/api/cve-catalog/(?:shards/.+\.jsonl\.gz|browser-index\.json\.gz|index\.json(?:\.gz)?|archetypes\.json|runtime-summary\.json)$ {
        try_files $uri =404;
        add_header Cache-Control $catalog_cache_control;
    }

    # Generated machine feeds have deterministic precompressed sidecars.
    location ~* \.(json|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
    }

    # Installed-app metadata and icons use stable discovery URLs. Keep them
    # revalidatable because iOS aggressively caches home-screen artwork.
    location = /site.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    location ~ ^/(?:apple-touch-icon(?:-180x180)?|icon-(?:192x192|512x512|maskable-512x512))\.png$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # Images and fonts are stable. CSS and JavaScript are not fingerprinted,
    # so cache them for an hour rather than pinning old catalog code for 30d.
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Friendly 404
    error_page 404 /404.html;
}
