# Browser catalog requests carry a deterministic ?v=<hash/date> token. Those
# representations can be cached immutably; direct/operator URLs stay short
# cached so daily refreshes are visible without a forced cache bust.
map $arg_v $catalog_cache_control {
    ""      "public, max-age=300, stale-while-revalidate=3600";
    default "public, max-age=31536000, immutable";
}

# Catalog search and exact-record delivery are bounded dynamic services,
# independent from static catalog assets and canonical CVE pages. Caddy
# supplies the original client chain; fall back to the direct peer for
# local/operator requests. Separate zones prevent one workload from consuming
# the other's request budget.
map $http_x_forwarded_for $cve_catalog_search_limit_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $cve_catalog_search_limit_key zone=cve_catalog_search:10m rate=10r/s;
limit_req_zone $cve_catalog_search_limit_key zone=cve_catalog_record:10m rate=20r/s;

# Recipe chat is a same-origin MCP route. Cookies are the signed visitor
# quota, so this location must forward them. Caddy supplies the original
# client chain; fall back to the direct peer for local/operator requests.
map $http_x_forwarded_for $recipe_chat_limit_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $recipe_chat_limit_key zone=recipe_chat:10m rate=5r/s;

# Canonical CVE pages are deterministic for a catalog revision. A small local
# cache absorbs crawler bursts and serves stale successful pages while the
# bounded MCP lookup process refreshes; no-store 404/503 responses are never
# cached because nginx honors the upstream Cache-Control header.
proxy_cache_path /var/cache/nginx/cve-landing levels=1:2 keys_zone=cve_landing:10m
                 max_size=256m inactive=24h use_temp_path=off;

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    large_client_header_buffers 8 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    # Caddy terminates TLS. Keep nginx-generated redirects relative so they do
    # not accidentally send public HTTPS clients back through an HTTP hop.
    absolute_redirect off;

    root   /usr/share/nginx/html;
    index  index.html;
    sendfile on;
    tcp_nopush on;

    # Avoid a filesystem metadata lookup for every request when thousands of
    # recipe and shard paths are hot at once.
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Retired CVE recipe slugs consolidate to the one canonical CVE URL. The
    # MCP route extracts and uppercases the identifier so this remains a
    # single HTTP redirect instead of a meta-refresh or lowercase hop.
    location = /recipes/cve {
        return 308 /cve-database/;
    }
    location = /recipes/cve/ {
        return 308 /cve-database/;
    }
    location = /recipes/cve/index.xml {
        return 308 /cve-database/index.xml;
    }
    location ~ ^/recipes/general/owasp-top-10-2026-(audit|remediate)/?$ {
        return 308 /recipes/general/owasp-top-10-2025-$1/;
    }
    # These reviewed records predate the runtime catalog's rolling window and
    # explicitly retain their static canonical URLs.
    location = /recipes/cve/cve-2014-0160-heartbleed/ {
        try_files /recipes/cve/cve-2014-0160-heartbleed/index.html =404;
    }
    location = /recipes/cve/cve-2014-6271-shellshock/ {
        try_files /recipes/cve/cve-2014-6271-shellshock/index.html =404;
    }
    location = /recipes/cve/cve-2017-18342-pyyaml/ {
        try_files /recipes/cve/cve-2017-18342-pyyaml/index.html =404;
    }
    location ~* "^/recipes/cve/[^/]+$" {
        return 308 $uri/;
    }
    location ~* "^/recipes/cve/[^/]+/$" {
        set $cve_landing_api "http://${MCP_UPSTREAM}:80";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $cve_landing_api$request_uri;
    }

    # The build outputs pretty URLs like /claude/, /recipes/, etc.
    # Try the literal path, then with trailing slash, then 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Evidence-qualified canonical CVE pages are materialized during the site
    # build. Serve that deterministic document first; records outside the
    # qualified search surface retain the bounded runtime renderer fallback.
    location ~* "^/cve/(CVE-[0-9]{4}-[0-9]{4,})$" {
        add_header Cache-Control "public, max-age=86400";
        return 308 /cve/$1/;
    }
    # Only the exact canonical uppercase shape may touch the static filesystem.
    # A case variant is delegated to the runtime route, which returns its
    # existing absolute canonical redirect without risking a stale case-variant
    # directory being served first.
    location ~ "^/cve/CVE-[0-9]{4}-[0-9]{4,}/$" {
        try_files $uri/index.html @cve_landing_runtime;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
    }
    location ~* "^/cve/CVE-[0-9]{4}-[0-9]{4,}/$" {
        error_page 418 = @cve_landing_runtime;
        return 418;
    }
    location @cve_landing_runtime {
        set $cve_landing_api "http://${MCP_UPSTREAM}:80";
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_cache cve_landing;
        proxy_cache_methods GET HEAD;
        # The renderer is path-only. Collapse tracking/query variants onto the
        # canonical path so they cannot evict useful entries from the bounded
        # cache or change which representation populates a shared cache key.
        proxy_cache_key "$scheme|$host|$uri";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This public read-only route never receives MCP credentials or browser
        # cookies. Cache-Control and X-Robots-Tag come from the renderer so
        # successful records stay briefly cacheable while 404/503 responses do not.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $cve_landing_api$uri;
        add_header X-CVE-Cache $upstream_cache_status always;
    }

    # The traffic report is written into a shared volume at runtime. Resolve
    # the index file explicitly so an empty/uninitialized directory is never
    # exposed as nginx's directory-listing 403 response.
    location = /traffic {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 308 /traffic/;
    }
    location = /traffic/ {
        try_files /traffic/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location = /traffic/traffic-theme.css {
        try_files /traffic/traffic-theme.css =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location ^~ /traffic/ {
        return 404;
    }

    # Hosted MCP endpoint served by the private mcp-server container.
    location = /mcp {
        set $mcp_api "http://${MCP_UPSTREAM}:80";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $mcp_api/mcp;
    }

    location /mcp/ {
        set $mcp_api "http://${MCP_UPSTREAM}:80";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $mcp_api$request_uri;
    }

    # Public, revision-pinned exact lookup. Current browsers use this bounded
    # API instead of learning the catalog's shard layout; the static shards
    # remain available only for the predecessor compatibility window.
    location ~ "^/api/cve-catalog/records/CVE-[0-9]{4}-[0-9]{4,}$" {
        set $cve_catalog_record_api "http://${MCP_UPSTREAM}:80";
        limit_req zone=cve_catalog_record burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @cve_catalog_record_rate_limited;
        error_page 500 502 503 504 = @cve_catalog_record_unavailable;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $cve_catalog_record_api$request_uri;
    }

    location @cve_catalog_record_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 429 '{"schema_version":1,"error":"record_rate_limited","message":"CVE record lookup rate limit exceeded. Retry shortly."}';
    }

    location @cve_catalog_record_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503 '{"schema_version":1,"error":"record_unavailable","message":"CVE record lookup is temporarily unavailable."}';
    }

    # Public, revision-pinned broad search. Keep this exact dynamic route out
    # of the static catalog namespace and give it its own abuse budget.
    location = /api/cve-catalog/search {
        set $cve_catalog_search_api "http://${MCP_UPSTREAM}:80";
        limit_req zone=cve_catalog_search burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @cve_catalog_search_rate_limited;
        error_page 500 502 503 504 = @cve_catalog_search_unavailable;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_cache off;
        proxy_intercept_errors on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass $cve_catalog_search_api$request_uri;
    }

    location @cve_catalog_search_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 429 '{"schema_version":1,"error":"search_rate_limited","message":"CVE search rate limit exceeded. Retry shortly."}';
    }

    location @cve_catalog_search_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503 '{"schema_version":1,"error":"search_unavailable","message":"CVE search is temporarily unavailable."}';
    }

    # Signed-cookie Recipe chat. Keep this prefix out of the static /api/
    # JSON namespace and do not strip cookies — quota lives in sr_recipe_chat.
    location ^~ /api/chat {
        set $recipe_chat_api "http://${MCP_UPSTREAM}:80";
        limit_req zone=recipe_chat burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @recipe_chat_rate_limited;
        error_page 500 502 503 504 = @recipe_chat_unavailable;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_pass $recipe_chat_api$request_uri;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location @recipe_chat_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 429 '{"error":"chat_rate_limited","message":"Recipe chat rate limit exceeded. Retry shortly."}';
    }

    location @recipe_chat_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 503 '{"error":"chat_unavailable","message":"Recipe chat is temporarily unavailable."}';
    }

    # Same-origin GitHub API relay for optional repository context.
    # Browser-supplied GitHub Authorization is forwarded only for this request.
    location /github-api/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header X-GitHub-Api-Version $http_x_github_api_version;
        proxy_pass https://api.github.com/;
    }

    # Catalog filenames are stable across daily refreshes, so keep a bounded
    # cache window and permit stale serving while an intermediary revalidates.
    location = /api/cve-catalog/manifest.json {
        try_files $uri =404;
        add_header Cache-Control $catalog_cache_control;
    }
    location ~ ^/api/cve-catalog/(?:shards/.+\.jsonl\.gz|browser-index\.json\.gz|index\.json(?:\.gz)?|archetypes\.json|runtime-summary\.json)$ {
        try_files $uri =404;
        add_header Cache-Control $catalog_cache_control;
    }

    # Generated machine feeds have deterministic precompressed sidecars.
    location ~* \.(json|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
    }

    # Installed-app metadata and icons use stable discovery URLs. Keep them
    # revalidatable because iOS aggressively caches home-screen artwork.
    location = /site.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    location ~ ^/(?:apple-touch-icon(?:-180x180)?|icon-(?:192x192|512x512|maskable-512x512))\.png$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    # Images and fonts are stable. CSS and JavaScript are not fingerprinted,
    # so cache them for an hour rather than pinning old catalog code for 30d.
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # Friendly 404
    error_page 404 /404.html;
}
