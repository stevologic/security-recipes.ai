    <text x="216" y="262" font-size="13" font-weight="730" fill="#f4f7f6">evidence-qualified</text>

    <rect x="400" y="230" width="168" height="40" rx="8" fill="#071211" fill-opacity="0.82" stroke="#a4d6cf" stroke-opacity="0.16"/>
    <text x="416" y="247" font-size="11" fill="#718582">RECIPES</text>
    <text x="416" y="262" font-size="13" font-weight="730" fill="#f4f7f6">bounded + reviewed</text>

    <rect x="580" y="230" width="200" height="40" rx="8" fill="#071211" fill-opacity="0.82" stroke="#2dd4bf" stroke-opacity="0.4"/>
