    <text x="52" y="247" font-size="11" fill="#718582">CATALOG</text>
    <text x="52" y="262" font-size="13" font-weight="730" fill="#f4f7f6">260,000+ CVEs</text>

    <rect x="200" y="230" width="188" height="40" rx="8" fill="#071211" fill-opacity="0.82" stroke="#a4d6cf" stroke-opacity="0.16"/>
