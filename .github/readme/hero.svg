  <rect x="0.5" y="0.5" width="959" height="299" rx="15.5" fill="none" stroke="#a4d6cf" stroke-opacity="0.16"/>
  <rect x="36" y="34" width="240" height="2" fill="url(#strand)"/>

  <circle cx="43" cy="66" r="4" fill="#2dd4bf"/>
