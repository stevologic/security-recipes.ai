  <text x="60" y="71" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2.4" fill="#5eead4">SECURITY-RECIPES.AI</text>

  <text x="36" y="127" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="760" letter-spacing="-1.4" fill="#f4f7f6">Search CVEs. Remediate</text>
  <text x="36" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="760" letter-spacing="-1.4" fill="#f4f7f6">vulnerabilities with <tspan fill="#5eead4">AI agents</tspan>.</text>

  <text x="36" y="207" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#aab9b7">Sourced NVD + CISA KEV intelligence, evidence-gated canonical records, and bounded remediation plans.</text>

