name: Content refresh

# Daily editorial maintenance for the reviewed, non-CVE knowledge base. Grok
# researches one bounded opportunity, updates the source content and dependent
# artifacts together, and submits the result through the normal review/build
# gate. CVE ingestion remains owned by cve-catalog-sync.yml.

on:
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: content-refresh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Detect xAI credentials
        id: auth
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XAI_API_KEY is not configured; daily content refresh is inactive until the repository secret is added."
          fi

      - name: Checkout default branch
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify xAI credentials are usable
        id: xai
        if: steps.auth.outputs.configured == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
        shell: bash
        run: python scripts/check_xai_credentials.py --github-output "$GITHUB_OUTPUT"

      - name: Install Grok CLI
        if: steps.xai.outputs.usable == 'true'
        shell: bash
        run: bash scripts/install_grok_cli.sh

      - name: Research and refresh reviewed content
        if: steps.xai.outputs.usable == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/run_grok_agent.py --prompt-file .github/prompts/content-refresh.md
