name: Production watchdog

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: production-watchdog
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Probe production site and catalog
        id: production
        continue-on-error: true
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://security-recipes.ai' }}
          WATCHDOG_MAX_CATALOG_AGE_HOURS: ${{ vars.WATCHDOG_MAX_CATALOG_AGE_HOURS || '72' }}
          WATCHDOG_REVISION_GRACE_MINUTES: ${{ vars.WATCHDOG_REVISION_GRACE_MINUTES || '1440' }}
        run: |
          python scripts/check_production_health.py \
            --base-url "$PRODUCTION_BASE_URL" \
            --expected-revision "$(git rev-parse HEAD)" \
            --expected-commit-time "$(git show -s --format=%cI HEAD)" \
            --max-catalog-age-hours "$WATCHDOG_MAX_CATALOG_AGE_HOURS" \
            --revision-grace-minutes "$WATCHDOG_REVISION_GRACE_MINUTES" \
            --report "$RUNNER_TEMP/production-health.json" \
            --markdown "$RUNNER_TEMP/production-health.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish watchdog summary
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/production-health.md" ]; then
            cat "$RUNNER_TEMP/production-health.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Production watchdog"
              echo
              echo "**UNHEALTHY:** The production probe did not produce a report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload watchdog diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-health.json
            ${{ runner.temp }}/production-health.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upsert or recover production health issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_HEALTHY: ${{ steps.production.outputs.healthy }}
        run: |
          LABEL="automation:production-health"
          TITLE="[watchdog] Production site, deployment, or CVE catalog is unhealthy"
          BODY_FILE="$RUNNER_TEMP/production-health-issue.md"
          gh label create "$LABEL" \
            --color "B60205" \
            --description "Production availability or freshness watchdog failure" \
            --force
          ISSUE_NUMBER="$(gh issue list \
            --label "$LABEL" \
            --state open \
            --limit 10 \
            --json number \
            --jq '.[0].number // empty')"

          if [ "$PROBE_HEALTHY" = "true" ]; then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue comment "$ISSUE_NUMBER" \
                --body "Production recovered in watchdog run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              gh issue close "$ISSUE_NUMBER" --reason completed
            fi
            exit 0
          fi

          {
            if [ -s "$RUNNER_TEMP/production-health.md" ]; then
              cat "$RUNNER_TEMP/production-health.md"
            else
              echo "The production watchdog failed before it could produce structured diagnostics."
            fi
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$BODY_FILE"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file "$BODY_FILE"
          fi

      - name: Self-heal an unbuilt main revision
        if: always() && steps.production.outputs.healthy != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          REPORT="$RUNNER_TEMP/production-health.json"
          if [ ! -s "$REPORT" ]; then
            echo "No structured report exists; skipping the revision self-heal."
            exit 0
          fi
          if ! jq -e '.checks[] | select(.name == "revision" and .ok == false)' "$REPORT" >/dev/null; then
            echo "The revision check is healthy; no Build dispatch is needed."
            exit 0
          fi

          # Merges performed with GITHUB_TOKEN do not emit push events, so a
          # merged main revision can exist without any Build; dispatching one
          # is the exception that GITHUB_TOKEN is allowed to trigger.
          MAIN_SHA="$(git rev-parse HEAD)"
          RUNS_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MAIN_SHA}&per_page=50" \
            --jq '[.workflow_runs[]
              | select(.path == ".github/workflows/build.yml")
              | {status, conclusion}]')"
          HEALTHY_RUNS="$(jq '[.[] | select(.conclusion == "success"
            or .status == "queued"
            or .status == "in_progress")] | length' <<<"$RUNS_JSON")"
          if [ "$HEALTHY_RUNS" -gt 0 ]; then
            echo "A Build already covers main revision ${MAIN_SHA}; the deploy pull cron will catch up."
            exit 0
          fi
          TOTAL_RUNS="$(jq 'length' <<<"$RUNS_JSON")"
          if [ "$TOTAL_RUNS" -ge 2 ]; then
            echo "::warning::Main revision ${MAIN_SHA} already failed ${TOTAL_RUNS} Build attempts; leaving it to AI maintenance."
            exit 0
          fi

          gh workflow run build.yml \
            --ref "$GITHUB_DEFAULT_BRANCH" \
            --field "expected_sha=${MAIN_SHA}" \
            --field "request_id=watchdog-heal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Dispatched the missing Build for main revision ${MAIN_SHA}."

      - name: Self-heal a stale CVE catalog
        if: always() && steps.production.outputs.healthy != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          REPORT="$RUNNER_TEMP/production-health.json"
          if [ ! -s "$REPORT" ]; then
            echo "No structured report exists; skipping the catalog self-heal."
            exit 0
          fi
          if ! jq -e '.checks[] | select(.name == "catalog" and .ok == false)' "$REPORT" >/dev/null; then
            echo "The catalog freshness check is healthy; no sync dispatch is needed."
            exit 0
          fi

          # One failed nightly sync leaves the catalog stale for a full day, so
          # redispatch it here, rate-limited so repeated failures cannot burn
          # NVD bandwidth or enrichment credits twice an hour.
          LAST_STARTED="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/cve-catalog-sync.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].created_at // ""')"
          if [ -n "$LAST_STARTED" ]; then
            LAST_EPOCH="$(date -d "$LAST_STARTED" +%s)"
            NOW_EPOCH="$(date +%s)"
            if [ $(( NOW_EPOCH - LAST_EPOCH )) -lt 21600 ]; then
              echo "The last catalog sync started at ${LAST_STARTED}; honoring the six-hour heal cooldown."
              exit 0
            fi
          fi

          gh workflow run cve-catalog-sync.yml --ref "$GITHUB_DEFAULT_BRANCH"
          echo "Dispatched a CVE catalog sync to refresh the stale catalog."

      - name: Fail unhealthy watchdog run
        if: steps.production.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Production availability, freshness, revision, or TLS checks failed."
          exit 1
