name: Dev DNS record

# Create or repair the DigitalOcean A record for
# https://dev.security-recipes.ai/. Same-repo pull requests receive
# repository secrets, which is how this job can run without a dispatch
# token. Do not add a push trigger; a failure there would strand deploy.sh.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: dev-dns-record
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect DigitalOcean credentials
        id: auth
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        shell: bash
        run: |
          token="${DIGITALOCEAN_ACCESS_TOKEN:-${DIGITALOCEAN_TOKEN:-${DO_TOKEN:-$DO_API_TOKEN}}}"
          if [ -n "$token" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$token"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::No DigitalOcean API token secret is configured; add DIGITALOCEAN_ACCESS_TOKEN and re-run this workflow."
              exit 1
            fi
            echo "::notice::No DigitalOcean API token secret is configured; skipping the staging A-record upsert."
          fi

      - name: Checkout source
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upsert the staging A record
        if: steps.auth.outputs.configured == 'true'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DIGITALOCEAN_ACCESS_TOKEN" ]; then
            export DIGITALOCEAN_ACCESS_TOKEN="${DIGITALOCEAN_TOKEN:-${DO_TOKEN:-$DO_API_TOKEN}}"
          fi
          python scripts/upsert_dev_dns_record.py
