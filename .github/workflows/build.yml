# Test the Eleventy and Docker build. Deployment is handled on the server.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python for checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Python check dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-dev.txt

      - name: Install site dependencies
        run: npm ci

      - name: Install Fail2Ban validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fail2ban nftables

      - name: Run lint and tests
        run: |
          python3 scripts/run_checks.py
          python3 scripts/validate_cve_catalog.py

      - name: Smoke test Caddy 404 ban state machine
        run: sudo bash tests/smoke_caddy_404_ban.sh

      - name: Compute production baseURL
        id: site
        run: |
          if [ -s "static/CNAME" ]; then
            HOST="$(grep -v '^[[:space:]]*$' static/CNAME | head -n1 | tr -d '[:space:]')"
            BASE_URL="https://${HOST}/"
          else
            BASE_URL="https://security-recipes.ai/"
          fi
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Using baseURL: ${BASE_URL}"

      - name: Build site
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: npm run build

      - name: Enforce production performance budgets
        run: npm run check:performance

      - name: Check Compose config
        run: docker compose --profile caddy config

      - name: Smoke test traffic report generator
        run: |
          report_dir="$(mktemp -d)"
          trap 'rm -rf "${report_dir}"' EXIT
          chmod 0777 "${report_dir}"
          traffic_image="$(docker compose --profile caddy config --format json | jq -er '.services["traffic-report"].image')"
          docker run --rm --entrypoint /bin/sh \
            --volume "${PWD}/docker/goaccess:/opt/security-recipes:ro" \
            --volume "${PWD}/tests/fixtures/caddy-access.jsonl:/logs/access.log:ro" \
            --volume "${report_dir}:/report" \
            "${traffic_image}" \
            /opt/security-recipes/generate-traffic-report.sh --once
          test -s "${report_dir}/index.html"
          test -s "${report_dir}/traffic-theme.css"
          grep -q "security-recipes.ai traffic" "${report_dir}/index.html"
          grep -q "traffic-theme.css" "${report_dir}/index.html"
          grep -q 'name="robots" content="noindex, nofollow, noarchive"' "${report_dir}/index.html"
          grep -q "security-recipes.ai traffic dashboard theme" "${report_dir}/traffic-theme.css"
          ! grep -q "Traffic report is warming up" "${report_dir}/index.html"
          ! grep -q "fixture-supersecret" "${report_dir}/index.html"
          ! grep -q "fixture-refsecret" "${report_dir}/index.html"
          ! grep -q "203.0.113.42" "${report_dir}/index.html"
          ! grep -q "203.0.113.0" "${report_dir}/index.html"

      - name: Validate deployment image builds
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          SITE_IMAGE="${IMAGE_PREFIX}-site:${GITHUB_SHA}"
          MCP_IMAGE="${IMAGE_PREFIX}-mcp:${GITHUB_SHA}"
          docker build \
            --build-arg "BASE_URL=${SECURITY_RECIPES_BASE_URL}" \
            --build-arg "REPO_URL=${SECURITY_RECIPES_REPO_URL}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${SITE_IMAGE}" .
          docker build \
            --file Dockerfile.mcp-server \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${MCP_IMAGE}" .

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute production baseURL
        id: site
        run: |
          if [ -s "static/CNAME" ]; then
            HOST="$(grep -v '^[[:space:]]*$' static/CNAME | head -n1 | tr -d '[:space:]')"
            BASE_URL="https://${HOST}/"
          else
            BASE_URL="https://security-recipes.ai/"
          fi
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Build immutable deployment images
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg "BASE_URL=${SECURITY_RECIPES_BASE_URL}" \
            --build-arg "REPO_URL=${SECURITY_RECIPES_REPO_URL}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE_PREFIX}-site:${GITHUB_SHA}" .
          docker build \
            --file Dockerfile.mcp-server \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE_PREFIX}-mcp:${GITHUB_SHA}" .

      - name: Publish immutable deployment images
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE_PREFIX}-site:${GITHUB_SHA}"
          docker push "${IMAGE_PREFIX}-mcp:${GITHUB_SHA}"
