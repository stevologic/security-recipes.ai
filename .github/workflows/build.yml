# Test the Eleventy and Docker build. Deployment is handled on the server.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python for checks
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Python check dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-dev.txt

      - name: Install site dependencies
        run: npm ci

      - name: Run lint and tests
        run: |
          python3 scripts/run_checks.py
          python3 scripts/validate_cve_catalog.py

      - name: Compute production baseURL
        id: site
        run: |
          if [ -s "static/CNAME" ]; then
            HOST="$(grep -v '^[[:space:]]*$' static/CNAME | head -n1 | tr -d '[:space:]')"
            BASE_URL="https://${HOST}/"
          else
            BASE_URL="https://security-recipes.ai/"
          fi
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Using baseURL: ${BASE_URL}"

      - name: Build site
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: npm run build

      - name: Enforce production performance budgets
        run: npm run check:performance

      - name: Check Compose config
        run: docker compose config

      - name: Build Docker images
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: docker compose build
