# Test the Eleventy and Docker build. Deployment is handled on the server.
name: Build
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
      && inputs.request_id != ''
      && format('CVE catalog Build {0} {1}', inputs.expected_sha, inputs.request_id)
      || 'Build' }}

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact main revision expected by an automation caller
        required: false
        default: ""
        type: string
      request_id:
        description: CVE automation request identifier; empty means a manual build
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('build-dispatch-{0}', github.run_id)
        || format('build-{0}', github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "Manual Build dispatch accepted at ${GITHUB_SHA}."
            exit 0
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Dispatched Build revision mismatch: expected=${EXPECTED_SHA} actual=${GITHUB_SHA} request=${REQUEST_ID:-unspecified}"
            exit 1
          fi
          echo "Verified dispatched Build revision ${GITHUB_SHA} for request ${REQUEST_ID:-unspecified}."

      - name: Setup Python for checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Python check dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements-dev.txt

      - name: Install site dependencies
        run: npm ci

      - name: Install Fail2Ban validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fail2ban nftables

      - name: Run lint and tests
        run: |
          python3 scripts/run_checks.py
          python3 scripts/validate_cve_catalog.py

      - name: Smoke test Caddy 404 ban state machine
        run: sudo bash tests/smoke_caddy_404_ban.sh

      - name: Compute production baseURL
        id: site
        run: |
          if [ -s "static/CNAME" ]; then
            HOST="$(grep -v '^[[:space:]]*$' static/CNAME | head -n1 | tr -d '[:space:]')"
            BASE_URL="https://${HOST}/"
          else
            BASE_URL="https://security-recipes.ai/"
          fi
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "Using baseURL: ${BASE_URL}"

      - name: Build site
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: npm run build

      - name: Enforce production performance budgets
        run: npm run check:performance

      - name: Check Compose config
        run: docker compose --profile caddy config

      - name: Smoke test traffic report generator
        run: |
          report_dir="$(mktemp -d)"
          trap 'rm -rf "${report_dir}"' EXIT
          chmod 0777 "${report_dir}"
          traffic_image="$(docker compose --profile caddy config --format json | jq -er '.services["traffic-report"].image')"
          docker run --rm --entrypoint /bin/sh \
            --volume "${PWD}/docker/goaccess:/opt/security-recipes:ro" \
            --volume "${PWD}/tests/fixtures/caddy-access.jsonl:/logs/access.log:ro" \
            --volume "${report_dir}:/report" \
            "${traffic_image}" \
            /opt/security-recipes/generate-traffic-report.sh --once
          test -s "${report_dir}/index.html"
          test -s "${report_dir}/traffic-theme.css"
          grep -q "security-recipes.ai traffic" "${report_dir}/index.html"
          grep -q "traffic-theme.css" "${report_dir}/index.html"
          grep -q 'name="robots" content="noindex, nofollow, noarchive"' "${report_dir}/index.html"
          grep -q "security-recipes.ai traffic dashboard theme" "${report_dir}/traffic-theme.css"
          ! grep -q "Traffic report is warming up" "${report_dir}/index.html"
          ! grep -q "fixture-supersecret" "${report_dir}/index.html"
          ! grep -q "fixture-refsecret" "${report_dir}/index.html"
          ! grep -q "203.0.113.42" "${report_dir}/index.html"
          ! grep -q "203.0.113.0" "${report_dir}/index.html"

      - name: Validate deployment image builds
        env:
          SECURITY_RECIPES_BASE_URL: ${{ steps.site.outputs.base_url }}
          SECURITY_RECIPES_REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          docker buildx create --name security-recipes-ci --driver docker-container --use
          docker buildx inspect --bootstrap
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          SITE_IMAGE="${IMAGE_PREFIX}-site:${GITHUB_SHA}"
          MCP_IMAGE="${IMAGE_PREFIX}-mcp:${GITHUB_SHA}"
          docker buildx build --load \
            --cache-from "type=gha,scope=security-recipes-site" \
            --cache-to "type=gha,scope=security-recipes-site,mode=max" \
            --build-arg "BASE_URL=${SECURITY_RECIPES_BASE_URL}" \
            --build-arg "REPO_URL=${SECURITY_RECIPES_REPO_URL}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${SITE_IMAGE}" .
          docker buildx build --load \
            --cache-from "type=gha,scope=security-recipes-mcp" \
            --cache-to "type=gha,scope=security-recipes-mcp,mode=max" \
            --file Dockerfile.mcp-server \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${MCP_IMAGE}" .

          smoke_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          smoke_network="security-recipes-smoke-${smoke_suffix}"
          site_name="security-recipes-site-${smoke_suffix}"
          mcp_name="security-recipes-mcp-${smoke_suffix}"
          site_container=""
          mcp_container=""
          cleanup_smoke_resources() {
            docker rm --force "${site_name}" "${mcp_name}" >/dev/null 2>&1 || true
            docker network rm "${smoke_network}" >/dev/null 2>&1 || true
          }
          trap cleanup_smoke_resources EXIT

          docker network create "${smoke_network}" >/dev/null

          # The stock nginx entrypoint renders default.conf.template before it
          # executes this command, so this validates the deployed config rather
          # than the unexpanded source template.
          docker run --rm \
            --env "MCP_UPSTREAM=${mcp_name}" \
            "${SITE_IMAGE}" nginx -t

          # Prove an evidence-qualified CVE is entirely static: start nginx
          # while its configured MCP hostname does not exist, then fetch it.
          site_container="$(docker run --detach --name "${site_name}" \
            --network "${smoke_network}" \
            --publish 127.0.0.1::80 \
            --env "MCP_UPSTREAM=${mcp_name}" \
            "${SITE_IMAGE}")"
          site_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' "${site_container}")"
          site_ready="false"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              "http://127.0.0.1:${site_port}/" >/dev/null; then
              site_ready="true"
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "${site_container}")" != "true" ]; then
              docker logs "${site_container}"
              echo "Site image exited before its smoke test." >&2
              exit 1
            fi
            sleep 1
          done
          if [ "${site_ready}" != "true" ]; then
            docker logs "${site_container}"
            echo "Site image did not become ready within 30 seconds." >&2
            exit 1
          fi

          # Re-run the complete rendered-site SEO and deployment-shape gate
          # against the no-Git Docker artifact, not only the host build.
          image_output="${RUNNER_TEMP}/site-image-output"
          mkdir -p "${image_output}"
          docker cp "${site_container}:/usr/share/nginx/html/." "${image_output}/"
          SITE_OUTPUT_DIR="${image_output}" node scripts/check_site_performance.js

          expected_canonical="${SECURITY_RECIPES_BASE_URL%/}/cve/CVE-2024-3400/"
          static_response="${RUNNER_TEMP}/site-static-cve-CVE-2024-3400.html"
          static_headers="${RUNNER_TEMP}/site-static-cve-CVE-2024-3400.headers"
          curl --fail --silent --show-error --max-time 10 \
            --dump-header "${static_headers}" \
            "http://127.0.0.1:${site_port}/cve/CVE-2024-3400/" \
            --output "${static_response}"
          grep -Fq "<link rel=\"canonical\" href=\"${expected_canonical}\">" "${static_response}"
          grep -Fq '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">' "${static_response}"
          grep -Fq 'data-cve-id="CVE-2024-3400"' "${static_response}"
          grep -Fq 'id="remediation-authority-heading"' "${static_response}"
          grep -Fq 'id="use-ai-heading"' "${static_response}"
          grep -Fq '"@type":"Article"' "${static_response}"
          grep -Fq '"additionalType":"https://schema.org/TechArticle"' "${static_response}"
          if grep -Eqi '^X-CVE-Cache:' "${static_headers}"; then
            echo "Qualified CVE unexpectedly reached the runtime fallback." >&2
            exit 1
          fi

          mcp_container="$(docker run --detach --name "${mcp_name}" \
            --network "${smoke_network}" \
            --publish 127.0.0.1::80 \
            --env "RECIPES_PUBLIC_SITE_BASE_URL=${SECURITY_RECIPES_BASE_URL}" \
            "${MCP_IMAGE}")"

          mcp_health="starting"
          for _ in $(seq 1 90); do
            mcp_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${mcp_container}")"
            case "${mcp_health}" in
              healthy)
                break
                ;;
              unhealthy|missing)
                docker logs "${mcp_container}"
                echo "MCP image healthcheck entered ${mcp_health} state." >&2
                exit 1
                ;;
            esac
            sleep 2
          done
          if [ "${mcp_health}" != "healthy" ]; then
            docker logs "${mcp_container}"
            echo "MCP image did not become healthy within 180 seconds." >&2
            exit 1
          fi

          mcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "80/tcp") 0).HostPort}}' "${mcp_container}")"
          mcp_response="${RUNNER_TEMP}/mcp-cve-CVE-2024-3400.html"
          curl --fail --silent --show-error --max-time 20 \
            "http://127.0.0.1:${mcp_port}/cve/CVE-2024-3400/" \
            --output "${mcp_response}"
          grep -Fq "<link rel=\"canonical\" href=\"${expected_canonical}\">" "${mcp_response}"
          grep -Fq '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">' "${mcp_response}"
          grep -Fq 'data-cve-id="CVE-2024-3400"' "${mcp_response}"
          grep -Fq 'id="remediation-authority-heading"' "${mcp_response}"
          grep -Fq 'id="use-ai-heading"' "${mcp_response}"
          grep -Fq '"@type":"Article"' "${mcp_response}"
          grep -Fq '"additionalType":"https://schema.org/TechArticle"' "${mcp_response}"

          # Exercise broad search through the deployed same-origin nginx route.
          # This is intentionally not an exact CVE query: it proves the MCP
          # image opened the manifest-pinned SQLite FTS artifact.
          catalog_revision="$(python3 -c 'import json; print(json.load(open("static/api/cve-catalog/manifest.json", encoding="utf-8"))["shard_set_sha256"])')"
          search_response="${RUNNER_TEMP}/site-cve-search.json"
          search_headers="${RUNNER_TEMP}/site-cve-search.headers"
          curl --fail --silent --show-error --max-time 10 \
            --dump-header "${search_headers}" \
            "http://127.0.0.1:${site_port}/api/cve-catalog/search?q=remote%20code%20execution&revision=${catalog_revision}&limit=5" \
            --output "${search_response}"
          grep -Eqi '^X-Robots-Tag: noindex' "${search_headers}"
          grep -Eqi '^X-CVE-Search-Backend:[[:space:]]*sqlite[[:space:]]*$' "${search_headers}"
          python3 - "${search_response}" "${catalog_revision}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["schema_version"] == 1
          assert payload["revision"] == sys.argv[2]
          assert payload["query"] == "remote code execution"
          assert isinstance(payload["total_matches"], int)
          assert 1 <= len(payload["results"]) <= 5
          assert payload["total_matches"] >= len(payload["results"])
          assert payload["truncated"] is (payload["total_matches"] > len(payload["results"]))
          assert all(
              isinstance(row.get("has_markdown"), bool)
              and str(row.get("shard", "")).startswith("shards/")
              for row in payload["results"]
          )
          PY

          # Select an in-catalog record that was deliberately excluded from the
          # qualified static surface, then prove nginx reaches the healthy MCP
          # fallback and preserves the noindex contract.
          nonqualified_cve="$(python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          catalog_root = Path("static/api/cve-catalog")
          qualified = {
              record["cve"]
              for record in json.loads(
                  (catalog_root / "search-indexable.json").read_text(encoding="utf-8")
              )["records"]
          }
          for index_path in sorted(
              (catalog_root / "indexes").glob("*.json.gz"), reverse=True
          ):
              payload = json.loads(gzip.decompress(index_path.read_bytes()))
              for record in payload["records"]:
                  cve_id = str(record.get("cve") or "")
                  if cve_id and cve_id not in qualified:
                      print(cve_id)
                      raise SystemExit(0)
          raise SystemExit("No nonqualified CVE exists for the runtime smoke test.")
          PY
          )"
          if [[ ! "${nonqualified_cve}" =~ ^CVE-[0-9]{4}-[0-9]{4,}$ ]]; then
            echo "Invalid nonqualified CVE selected: ${nonqualified_cve}" >&2
            exit 1
          fi
          runtime_response="${RUNNER_TEMP}/site-runtime-cve-${nonqualified_cve}.html"
          runtime_headers="${RUNNER_TEMP}/site-runtime-cve-${nonqualified_cve}.headers"
          curl --fail --silent --show-error --max-time 20 \
            --dump-header "${runtime_headers}" \
            "http://127.0.0.1:${site_port}/cve/${nonqualified_cve}/" \
            --output "${runtime_response}"
          runtime_canonical="${SECURITY_RECIPES_BASE_URL%/}/cve/${nonqualified_cve}/"
          grep -Fq "<link rel=\"canonical\" href=\"${runtime_canonical}\">" "${runtime_response}"
          grep -Fq '<meta name="robots" content="noindex,follow">' "${runtime_response}"
          grep -Fq "data-cve-id=\"${nonqualified_cve}\"" "${runtime_response}"
          grep -Fq 'id="remediation-authority-heading"' "${runtime_response}"
          grep -Fq 'id="use-ai-heading"' "${runtime_response}"
          grep -Eqi '^X-CVE-Cache:' "${runtime_headers}"

          # A case variant must be canonicalized by the runtime route, never
          # satisfied by a stale mixed/lowercase directory in the static image.
          lowercase_headers="${RUNNER_TEMP}/site-lowercase-cve.headers"
          lowercase_status="$(curl --silent --show-error --max-time 10 \
            --dump-header "${lowercase_headers}" \
            --output /dev/null \
            --write-out '%{http_code}' \
            "http://127.0.0.1:${site_port}/cve/cve-2024-3400/")"
          if [ "${lowercase_status}" != "308" ]; then
            echo "Lowercase CVE returned ${lowercase_status}; expected 308." >&2
            exit 1
          fi
          grep -Fqi "location: ${expected_canonical}" "${lowercase_headers}"

      - name: Package verified deployment images
        if: github.event_name != 'pull_request'
        env:
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/verified-deployment-images
        run: |
          set -euo pipefail
          mkdir -p "${IMAGE_ARCHIVE_DIR}"
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          SITE_IMAGE="${IMAGE_PREFIX}-site:${GITHUB_SHA}"
          MCP_IMAGE="${IMAGE_PREFIX}-mcp:${GITHUB_SHA}"
          site_id="$(docker image inspect --format '{{.Id}}' "${SITE_IMAGE}")"
          mcp_id="$(docker image inspect --format '{{.Id}}' "${MCP_IMAGE}")"

          docker save "${SITE_IMAGE}" "${MCP_IMAGE}" |
            gzip -1 > "${IMAGE_ARCHIVE_DIR}/images.tar.gz"
          test -s "${IMAGE_ARCHIVE_DIR}/images.tar.gz"
          (
            cd "${IMAGE_ARCHIVE_DIR}"
            sha256sum images.tar.gz > images.tar.gz.sha256
          )
          {
            printf 'site_image=%s\n' "${SITE_IMAGE}"
            printf 'site_id=%s\n' "${site_id}"
            printf 'mcp_image=%s\n' "${MCP_IMAGE}"
            printf 'mcp_id=%s\n' "${mcp_id}"
          } > "${IMAGE_ARCHIVE_DIR}/image-identities.env"

      - name: Upload verified deployment images
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-deployment-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-deployment-images
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified deployment images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-deployment-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-deployment-images

      - name: Verify and load deployment images
        env:
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/verified-deployment-images
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          SITE_IMAGE="${IMAGE_PREFIX}-site:${GITHUB_SHA}"
          MCP_IMAGE="${IMAGE_PREFIX}-mcp:${GITHUB_SHA}"
          identity_file="${IMAGE_ARCHIVE_DIR}/image-identities.env"

          if [ "$(wc -l < "${identity_file}" | tr -d '[:space:]')" != "4" ] ||
            [ "$(grep -Ec '^(site_image|site_id|mcp_image|mcp_id)=' "${identity_file}")" != "4" ]; then
            echo "Verified image identity manifest has an unexpected shape." >&2
            exit 1
          fi
          recorded_site_image="$(sed -n 's/^site_image=//p' "${identity_file}")"
          recorded_site_id="$(sed -n 's/^site_id=//p' "${identity_file}")"
          recorded_mcp_image="$(sed -n 's/^mcp_image=//p' "${identity_file}")"
          recorded_mcp_id="$(sed -n 's/^mcp_id=//p' "${identity_file}")"
          if [ "${recorded_site_image}" != "${SITE_IMAGE}" ] ||
            [ "${recorded_mcp_image}" != "${MCP_IMAGE}" ]; then
            echo "Verified image references do not match this workflow revision." >&2
            exit 1
          fi
          if [[ ! "${recorded_site_id}" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            [[ ! "${recorded_mcp_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Verified image identity manifest contains an invalid image ID." >&2
            exit 1
          fi
          (
            cd "${IMAGE_ARCHIVE_DIR}"
            sha256sum --check --strict images.tar.gz.sha256
            gzip --decompress --stdout images.tar.gz | docker load
          )
          loaded_site_id="$(docker image inspect --format '{{.Id}}' "${SITE_IMAGE}")"
          loaded_mcp_id="$(docker image inspect --format '{{.Id}}' "${MCP_IMAGE}")"
          if [ "${loaded_site_id}" != "${recorded_site_id}" ] ||
            [ "${loaded_mcp_id}" != "${recorded_mcp_id}" ]; then
            echo "Loaded deployment image IDs differ from the smoke-tested images." >&2
            exit 1
          fi

      - name: Compute immutable image tag
        id: image
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/development" ]; then
            IMAGE_TAG="${GITHUB_SHA}-development"
          else
            IMAGE_TAG="${GITHUB_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable deployment images
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          SITE_SOURCE_IMAGE="${IMAGE_PREFIX}-site:${GITHUB_SHA}"
          MCP_SOURCE_IMAGE="${IMAGE_PREFIX}-mcp:${GITHUB_SHA}"
          SITE_TARGET_IMAGE="${IMAGE_PREFIX}-site:${IMAGE_TAG}"
          MCP_TARGET_IMAGE="${IMAGE_PREFIX}-mcp:${IMAGE_TAG}"
          if [ "${IMAGE_TAG}" != "${GITHUB_SHA}" ]; then
            docker tag "${SITE_SOURCE_IMAGE}" "${SITE_TARGET_IMAGE}"
            docker tag "${MCP_SOURCE_IMAGE}" "${MCP_TARGET_IMAGE}"
          fi
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${SITE_TARGET_IMAGE}"
          docker push "${MCP_TARGET_IMAGE}"
