name: Leftover review

# Daily leftover-gold closer. Leftover-gold criticals and highs drain first.
# After those close, each run reviews up to 100 leftover-gold medium and low
# pages against live GHAD/NVD and submits a validated auto-merge PR.
# Intelligence is Grok via XAI_API_KEY (Grok Build CLI), not OpenAI Codex.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: leftover-review
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Detect xAI credentials
        id: auth
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XAI_API_KEY is not configured; daily leftover review is inactive until the repository secret is added."
          fi

      - name: Checkout default branch
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify xAI credentials are usable
        id: xai
        if: steps.auth.outputs.configured == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
        shell: bash
        run: python scripts/check_xai_credentials.py --github-output "$GITHUB_OUTPUT"

      - name: Select leftover-gold queue
        id: queue
        if: steps.xai.outputs.usable == 'true'
        shell: bash
        run: |
          python scripts/pick_leftover_review_queue.py --json > "$RUNNER_TEMP/leftover-review-queue.json"
          python scripts/pick_leftover_review_queue.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"], "leftover-review-queue.json").read_text(
                  encoding="utf-8"
              )
          )
          print(f"selected={payload['selected_total']}")
          PY

      - name: Install Grok CLI
        if: steps.xai.outputs.usable == 'true' && steps.queue.outputs.selected != '0'
        shell: bash
        run: bash scripts/install_grok_cli.sh

      - name: Review leftover-gold pages
        if: steps.xai.outputs.usable == 'true' && steps.queue.outputs.selected != '0'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/run_grok_agent.py --prompt-file .github/prompts/leftover-review.md
