name: AI issue maintenance

# Unattended issue triage: Grok works open issues filed by the repository
# owner or its own automation, fixes root causes through auto-merge PRs that
# the Automation shepherd delivers, and closes what it can prove resolved.
# Issues created with GITHUB_TOKEN emit no `issues` events, so the event
# trigger only covers owner-authored issues. The workflows that publish
# automation issues (the watchdog and the catalog sync) chain into this one
# on completion, so a token-published issue is worked minutes after it is
# filed instead of waiting for the twice-daily sweep, which remains the
# backstop.
# The same prompt is the Cursor Automation playbook in
# .github/prompts/ai-issue-maintenance.md.

on:
  issues:
    types:
      - opened
      - reopened
  workflow_run:
    workflows:
      - Production watchdog
      - CVE catalog sync
    types:
      - completed
  schedule:
    - cron: "41 4,16 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-issue-maintenance
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  triage:
    if: >-
      github.event_name != 'issues' ||
      github.event.issue.user.login == 'stevologic' ||
      github.event.issue.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Detect xAI credentials
        id: auth
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XAI_API_KEY is not configured; AI issue maintenance is inactive until the repository secret is added."
          fi

      - name: Select issues that need triage
        id: work
        if: steps.auth.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout exists yet, so gh must be told its repository context.
          GH_REPO: ${{ github.repository }}
          TARGET_ISSUE: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        shell: bash
        run: |
          if [ -n "$TARGET_ISSUE" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Selected TARGET_ISSUE #${TARGET_ISSUE}."
            exit 0
          fi
          COUNT="$(gh issue list \
            --state open \
            --limit 50 \
            --json number,author,labels \
            --jq '[.[]
              | select(
                  .author.login == "stevologic"
                  or .author.login == "github-actions[bot]"
                  or .author.login == "github-actions"
                )
              | select([.labels[].name] | index("automation:ai-triaged") | not)
            ] | length')"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No untriaged owner or automation issues; skipping Grok."
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "Selected ${COUNT} untriaged owner or automation issue(s)."

      - name: Checkout default branch
        if: steps.auth.outputs.configured == 'true' && steps.work.outputs.needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify xAI credentials are usable
        id: xai
        if: steps.auth.outputs.configured == 'true' && steps.work.outputs.needed == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
        shell: bash
        run: python scripts/check_xai_credentials.py --github-output "$GITHUB_OUTPUT"

      - name: Install Grok CLI
        if: steps.xai.outputs.usable == 'true'
        shell: bash
        run: bash scripts/install_grok_cli.sh

      - name: Triage and repair open issues
        if: steps.xai.outputs.usable == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GH_TOKEN: ${{ github.token }}
          TARGET_ISSUE: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        shell: bash
        run: python scripts/run_grok_agent.py --prompt-file .github/prompts/ai-issue-maintenance.md
