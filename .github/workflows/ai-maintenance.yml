name: AI maintenance

# Unattended repair layer: when automation-critical workflows fail, Grok
# investigates the failure, fixes root causes in a branch, and opens an
# auto-merge PR that the Automation shepherd validates and lands. It never
# pushes to main directly and never merges its own work.
# The same prompt is the Cursor Automation playbook in
# .github/prompts/ai-maintenance.md.

on:
  workflow_run:
    workflows:
      - Build
      - CVE catalog sync
      - Content refresh
      - Leftover review
      - Production watchdog
      - CVE catalog validation
      - Automation shepherd
      - AI issue maintenance
      - Search indexing
    types:
      - completed

permissions: {}

concurrency:
  # One group per failed run. A single shared group looked safe but silently
  # dropped work: GitHub keeps only the newest pending run in a group, so a
  # burst of completions cancelled the queued investigations and a real CVE
  # sync failure went unhandled. Each failure now gets its own repair run,
  # while retries of the same run still collapse into one.
  group: ai-maintenance-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'automation/cve-catalog-sync' ||
       startsWith(github.event.workflow_run.head_branch, 'automation/') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Detect xAI credentials
        id: auth
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XAI_API_KEY is not configured; AI maintenance is inactive until the repository secret is added."
          fi

      - name: Checkout default branch
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify xAI credentials are usable
        id: xai
        if: steps.auth.outputs.configured == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
        shell: bash
        run: python scripts/check_xai_credentials.py --github-output "$GITHUB_OUTPUT"

      - name: Install Grok CLI
        if: steps.xai.outputs.usable == 'true'
        shell: bash
        run: bash scripts/install_grok_cli.sh

      - name: Investigate and repair the failed automation
        if: steps.xai.outputs.usable == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL || 'grok-4.6' }}
          GH_TOKEN: ${{ github.token }}
          FAILED_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          FAILED_WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: python scripts/run_grok_agent.py --prompt-file .github/prompts/ai-maintenance.md
