name: AI maintenance

# Unattended repair layer: when automation-critical workflows fail, Codex
# investigates the failure, fixes root causes in a branch, and opens an
# auto-merge PR that the Automation shepherd validates and lands. It never
# pushes to main directly and never merges its own work.

on:
  workflow_run:
    workflows:
      - Build
      - CVE catalog sync
      - Content refresh
      - Leftover review
      - Production watchdog
      - CVE catalog validation
      - Automation shepherd
      - AI issue maintenance
      - Search indexing
    types:
      - completed

permissions: {}

concurrency:
  # One group per failed run. A single shared group looked safe but silently
  # dropped work: GitHub keeps only the newest pending run in a group, so a
  # burst of completions cancelled the queued investigations and a real CVE
  # sync failure went unhandled. Each failure now gets its own repair run,
  # while retries of the same run still collapse into one.
  group: ai-maintenance-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'automation/cve-catalog-sync' ||
       startsWith(github.event.workflow_run.head_branch, 'automation/') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Detect OpenAI credentials
        id: auth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured; AI maintenance is inactive until the repository secret is added."
          fi

      - name: Checkout default branch
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Verify OpenAI credentials are usable
        id: openai
        if: steps.auth.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: python scripts/check_openai_credentials.py --github-output "$GITHUB_OUTPUT"

      - name: Investigate and repair the failed automation
        if: steps.openai.outputs.usable == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Writes stay confined to the checkout; network stays on so the
          # agent can query gh and push its fix branch.
          sandbox: workspace-write
          codex-args: '["-c","sandbox_workspace_write.network_access=true"]'
          prompt: |
            You are the unattended maintenance engineer for this repository.
            The workflow "${{ github.event.workflow_run.name }}" concluded
            FAILURE on branch "${{ github.event.workflow_run.head_branch }}".
            Failed run: ${{ github.event.workflow_run.html_url }}
            (run id ${{ github.event.workflow_run.id }}).

            Work the failure end to end:
            1. Inspect it with
               `gh run view ${{ github.event.workflow_run.id }} --log-failed`
               and related recent runs of the same workflow.
            2. Reproduce locally when practical (python -m unittest ...,
               node --test tests/..., npm run build).
            3. Root-cause it and prefer the smallest durable fix. When a test
               pins volatile catalog data, convert it to assert the governing
               policy instead (see the editorial lastmod test in
               tests/test_cve_landing.py for the established pattern).
            4. If a repository change fixes it: create a branch named
               automation/ai-fix-<short-topic>, commit with a clear message,
               push it, open a PR to main that explains root cause, fix, and
               verification, then enable auto-merge with
               `gh pr merge --auto --squash <pr-number>`. The Automation
               shepherd workflow attaches the required build validation and
               GitHub completes the merge; never merge directly and never
               push to main.
            5. If the failure is outside the repository (production droplet,
               external feeds, registry outages), comment your diagnosis on
               the open issue labeled automation:production-health, or create
               that issue if none is open, instead of opening a PR.
            6. If an open automation/ai-fix-* PR already covers the same root
               cause, push improvements to that PR instead of opening a
               duplicate.

            Constraints: never force-push, never weaken or skip checks and
            tests to make them pass, never edit unrelated code, and if the
            root cause remains genuinely unclear after investigation, record
            your findings on the automation:production-health issue rather
            than guessing at a fix.
