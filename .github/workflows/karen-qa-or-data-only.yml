# Required-check stand-in for karen-qa on main.
#
# Ruleset change (do not apply from this workflow): if the required check
# name on main is still `karen-qa`, replace that pin with
# `karen-qa-or-data-only` from GitHub Actions. If this job or context is
# renamed, update the main ruleset to the new name. Do not require both
# names or catalog/pipeline PRs still need Karen QA. Changing this
# workflow or the ruleset still requires karen-qa; the gate cannot
# exempt itself.
#
# Auto-passes when every Files API path is catalog data or the explicit
# CVE pipeline files. Author does not matter. This workflow never checks
# out or runs pull-request code and never emits the `karen-qa` context.
name: Karen QA or data-only

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  check_run:
    types:
      - completed
  status:

permissions: {}

concurrency:
  group: >-
    karen-qa-or-data-only-${{
      github.event.pull_request.number ||
      github.event.check_run.head_sha ||
      github.event.sha
    }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  karen-qa-or-data-only:
    name: karen-qa-or-data-only
    if: >-
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch) ||
      (github.event_name == 'check_run' &&
      github.event.check_run.name == 'karen-qa' &&
      github.event.check_run.conclusion == 'success') ||
      (github.event_name == 'status' &&
      github.event.context == 'karen-qa' &&
      github.event.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Trusted default-branch sources only. Do not use github.sha here:
      # check_run and status events set it to the triggering commit (the
      # PR head). Never checkout pull_request.head.sha or run PR code.
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Evaluate data-only exemption or require karen-qa on the exact head
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          STATUS_SHA: ${{ github.event.sha }}
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          PR_NUMBER="${EVENT_PR_NUMBER:-}"
          HEAD_SHA=""

          if [ "$EVENT_NAME" != "pull_request_target" ]; then
            HEAD_SHA="${CHECK_HEAD_SHA:-${STATUS_SHA:-}}"
            if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Event is missing a full commit SHA."
              exit 1
            fi
            PR_NUMBER="$(HEAD_SHA="$HEAD_SHA" REPO="$GITHUB_REPOSITORY" BASE="$DEFAULT_BRANCH" gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              -H "Accept: application/vnd.github.groot-preview+json" \
              --jq '[.[] | select(.state == "open" and .base.ref == env.BASE and .head.repo.full_name == env.REPO and .head.sha == env.HEAD_SHA)] | first | .number // empty')"
            if [ -z "$PR_NUMBER" ]; then
              echo "No open same-repository PR against ${DEFAULT_BRANCH} for ${HEAD_SHA}."
              echo "state=success" >> "$GITHUB_OUTPUT"
              echo "context=karen-qa-or-data-only" >> "$GITHUB_OUTPUT"
              echo "description=No matching open PR" >> "$GITHUB_OUTPUT"
              echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
              echo "skip_status=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            > "$RUNNER_TEMP/files.json"
          LIVE_HEAD="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          if [[ ! "$LIVE_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull request is missing a full head SHA."
            exit 1
          fi
          HEAD_SHA="$LIVE_HEAD"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/statuses" \
            > "$RUNNER_TEMP/statuses.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[]' | jq -s '.' > "$RUNNER_TEMP/check-runs.json"

          set +e
          python3 scripts/karen_qa_or_data_only.py \
            --author-login "$(jq -r '.user.login' "$RUNNER_TEMP/pr.json")" \
            --head-branch "$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")" \
            --base-branch "$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")" \
            --repository "$GITHUB_REPOSITORY" \
            --head-repository "$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pr.json")" \
            --head-sha "$HEAD_SHA" \
            --expected-base-branch "$DEFAULT_BRANCH" \
            --files-json "$RUNNER_TEMP/files.json" \
            --statuses-json "$RUNNER_TEMP/statuses.json" \
            --check-runs-json "$RUNNER_TEMP/check-runs.json" \
            --github-output "$GITHUB_OUTPUT"
          STATUS=$?
          set -e
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "skip_status=false" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "decision_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "decision_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post karen-qa-or-data-only on the exact head
        if: steps.decide.outputs.skip_status != 'true'
        env:
          DESCRIPTION: ${{ steps.decide.outputs.description }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
          STATE: ${{ steps.decide.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to post a status without a full head SHA."
            exit 1
          fi
          if [ "$STATE" != "success" ] && [ "$STATE" != "failure" ]; then
            echo "::error::Decision did not produce a success or failure state."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context="karen-qa-or-data-only" \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$STATE" != "success" ]; then
            echo "::error::needs karen-qa on ${HEAD_SHA} from Karen QA app"
            exit 1
          fi
