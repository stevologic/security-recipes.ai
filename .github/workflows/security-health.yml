name: Security health

# This repository consumes its own published action: an LLM check grounded
# in the hosted security-recipes.ai MCP context, running on the existing
# xAI/Grok key with the model auto-selected to the lowest available.

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-health-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect xAI credentials
        id: auth
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$XAI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XAI_API_KEY is not configured; the health check is skipped until the repository secret is added."
          fi

      - name: Run the Security Recipes health check
        # Repository and fork pull requests do not receive Actions secrets.
        # Do not turn an unavailable optional LLM credential into a broken
        # application build; scheduled and trusted runs still exercise it.
        # Never put `secrets` in `if:` — GitHub rejects that named-value while
        # validating the file on push, records a zero-job failure named after
        # the workflow path, and deploy.sh then refuses the SHA.
        if: steps.auth.outputs.configured == 'true'
        uses: ./actions/security-health
        with:
          provider: xai
          api-key: ${{ secrets.XAI_API_KEY }}
          check-containers: "true"
          check-cve-exposure: "true"
          # Verdicts guide review; the build gate stays the required check,
          # so an LLM warn/fail surfaces loudly without blocking the
          # autonomous merge train.
          fail-on: never
