version: 2

# Version updates enter development and its full Build gate. Weekly grouping
# limits branch churn; security updates remain alert-driven on GitHub's default
# branch and are not delayed by these version-update schedules.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#target-branch

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "development"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Phoenix"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "America/Phoenix"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "development"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "America/Phoenix"
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "development"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "07:00"
      timezone: "America/Phoenix"
    groups:
      compose-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "America/Phoenix"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-cache-major:
        patterns:
          - "actions/cache/restore"
          - "actions/cache/save"
        update-types:
          - "major"
